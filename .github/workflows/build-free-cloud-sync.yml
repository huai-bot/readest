# .github/workflows/build-free-cloud-sync.yml
#
# 关掉 CLOUD_SYNC_REQUIRES_PREMIUM，编译 Windows exe +（可选）Android APK
# 不依赖官方签名 / Discord 等 Secrets
#
# 用法：Actions → Build free cloud-sync → Run workflow
# 把本文件完整覆盖到你 fork 的：
#   .github/workflows/build-free-cloud-sync.yml

name: Build free cloud-sync

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Windows: Release 优化构建（无黑终端；更慢）"
        type: boolean
        default: true
      build_android:
        description: "同时编译 Android APK"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  APP_DIR: apps/readest-app

jobs:
  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo & pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            node_modules
            apps/readest-app/node_modules
          # v3: 避免旧缓存导致 which 等模块缺失
          key: free-cloud-win-v3-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/readest-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            free-cloud-win-v3-${{ runner.os }}-

      - name: Disable cloud-sync premium gate
        run: |
          set -euo pipefail
          FILE="apps/readest-app/src/utils/access.ts"
          sed -i 's/export const CLOUD_SYNC_REQUIRES_PREMIUM = true;/export const CLOUD_SYNC_REQUIRES_PREMIUM = false;/' "$FILE"
          grep -n 'CLOUD_SYNC_REQUIRES_PREMIUM' "$FILE"
          grep -q 'CLOUD_SYNC_REQUIRES_PREMIUM = false' "$FILE"

      - name: Install JS dependencies
        run: |
          set -euo pipefail
          # Windows + pnpm 严格隔离时 cross-spawn 会找不到 which
          echo "node-linker=hoisted" >> .npmrc
          pnpm install
          pnpm add -w which || pnpm add which || true

      - name: Vendor wasm / pdfjs assets
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          for leaf in \
            prepare-public-vendor \
            copy-pdfjs-js copy-pdfjs-wasm copy-pdfjs-fonts \
            copy-flatten-pdfjs-annotation-layer-css copy-flatten-pdfjs-text-layer-css \
            copy-simplecc copy-jieba
          do
            pnpm run "$leaf" || echo "::warning::vendor optional fail: $leaf"
          done

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        run: pnpm build

      - name: Build Windows (Tauri)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          printf '%s\n' '{"build":{"beforeBuildCommand":""}}' > .ci-tauri-override.json

          if [ "${{ inputs.release }}" = "true" ]; then
            FLAG=""
            PROFILE="release"
          else
            FLAG="--debug"
            PROFILE="debug"
          fi

          if [ -f .env.tauri ]; then
            pnpm exec dotenv -e .env.tauri -- tauri build $FLAG --no-bundle --config .ci-tauri-override.json \
              || pnpm exec tauri build $FLAG --no-bundle --config .ci-tauri-override.json
          else
            pnpm exec tauri build $FLAG --no-bundle --config .ci-tauri-override.json
          fi

          ROOT="${GITHUB_WORKSPACE}"
          EXE=$(find "$ROOT" -name 'readest.exe' -type f 2>/dev/null | head -1)
          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            echo "::error::readest.exe not found"
            find "$ROOT/target" -name '*.exe' 2>/dev/null | head -50 || true
            exit 1
          fi
          mkdir -p "$ROOT/dist"
          cp "$EXE" "$ROOT/dist/readest.exe"
          ls -la "$ROOT/dist/"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-free-cloud-sync-windows
          path: dist/readest.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Android
  # 错误原因：仓库里 gen/android 是空目录，没有 settings.gradle，
  # 必须先 tauri android init 生成完整 Gradle 工程再 build。
  # ---------------------------------------------------------------------------
  build-android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & platforms
        run: |
          set -euo pipefail
          sdkmanager --install \
            "ndk;27.0.12077973" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"
          yes | sdkmanager --licenses || true

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          NDK_DIR="${ANDROID_HOME}/ndk/27.0.12077973"
          echo "NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          test -d "$NDK_DIR"
          ls -la "${ANDROID_HOME}/ndk"

      - name: Cache cargo & pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            node_modules
            apps/readest-app/node_modules
          key: free-cloud-and-v3-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/readest-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            free-cloud-and-v3-${{ runner.os }}-

      - name: Disable cloud-sync premium gate
        run: |
          set -euo pipefail
          FILE="apps/readest-app/src/utils/access.ts"
          sed -i 's/export const CLOUD_SYNC_REQUIRES_PREMIUM = true;/export const CLOUD_SYNC_REQUIRES_PREMIUM = false;/' "$FILE"
          grep -n 'CLOUD_SYNC_REQUIRES_PREMIUM' "$FILE"
          grep -q 'CLOUD_SYNC_REQUIRES_PREMIUM = false' "$FILE"

      - name: Install JS dependencies
        run: |
          set -euo pipefail
          echo "node-linker=hoisted" >> .npmrc
          pnpm install

      - name: Vendor wasm / pdfjs assets
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          for leaf in \
            prepare-public-vendor \
            copy-pdfjs-js copy-pdfjs-wasm copy-pdfjs-fonts \
            copy-flatten-pdfjs-annotation-layer-css copy-flatten-pdfjs-text-layer-css \
            copy-simplecc copy-jieba
          do
            pnpm run "$leaf" || echo "::warning::vendor optional fail: $leaf"
          done

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        run: pnpm build

      - name: Init Android project (gen/android)
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          # 上游仓库里 gen/android 是空目录，没有 Gradle 工程文件
          rm -rf src-tauri/gen/android
          pnpm exec tauri android init

          # 确认 Gradle 根文件已生成
          test -f src-tauri/gen/android/settings.gradle \
            || test -f src-tauri/gen/android/settings.gradle.kts
          ls -la src-tauri/gen/android/

          # 若存在 store flavor（foss/googleplay），默认选 foss，避免 variant 歧义
          GRADLE_KTS="src-tauri/gen/android/app/build.gradle.kts"
          if [ -f "$GRADLE_KTS" ] && ! grep -q 'missingDimensionStrategy' "$GRADLE_KTS"; then
            if grep -q 'defaultConfig' "$GRADLE_KTS"; then
              sed -i 's/defaultConfig {/defaultConfig {\n        missingDimensionStrategy("store", "foss")/' "$GRADLE_KTS" || true
            fi
          fi

      - name: Build Android APK (debug-signed)
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          # debug 签名便于侧载；aarch64 覆盖绝大多数手机
          if [ -f .env.tauri ]; then
            pnpm exec dotenv -e .env.tauri -- tauri android build --debug --apk -t aarch64 \
              || pnpm exec tauri android build --debug --apk -t aarch64
          else
            pnpm exec tauri android build --debug --apk -t aarch64
          fi

          ROOT="${GITHUB_WORKSPACE}"
          mkdir -p "$ROOT/dist"
          APK=$(find "$ROOT" -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK not found"
            find "$ROOT" -name '*.apk' 2>/dev/null | head -30 || true
            find "$ROOT/apps/readest-app/src-tauri/gen/android" -type f -name '*.apk' 2>/dev/null | head -20 || true
            exit 1
          fi
          cp "$APK" "$ROOT/dist/Readest-free-cloud-sync.apk"
          ls -la "$ROOT/dist/"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-free-cloud-sync-android
          path: dist/Readest-free-cloud-sync.apk
          if-no-files-found: error
          retention-days: 14
