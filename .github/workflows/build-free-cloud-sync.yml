# .github/workflows/build-free-cloud-sync.yml
#
# 关掉 CLOUD_SYNC_REQUIRES_PREMIUM，编译 Windows exe +（可选）Android APK
# 不依赖官方签名 / Discord 等 Secrets
#
# 用法：Actions → Build free cloud-sync → Run workflow
# 把本文件完整覆盖到你 fork 的：
#   .github/workflows/build-free-cloud-sync.yml

name: Build free cloud-sync

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Windows: Release 优化构建（无黑终端；更慢）"
        type: boolean
        default: true
      build_android:
        description: "同时编译 Android APK"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  APP_DIR: apps/readest-app

jobs:
  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo & pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            node_modules
            apps/readest-app/node_modules
          key: free-cloud-win-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/readest-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            free-cloud-win-v4-${{ runner.os }}-

      - name: Disable cloud-sync premium gate
        run: |
          set -euo pipefail
          FILE="apps/readest-app/src/utils/access.ts"
          sed -i 's/export const CLOUD_SYNC_REQUIRES_PREMIUM = true;/export const CLOUD_SYNC_REQUIRES_PREMIUM = false;/' "$FILE"
          grep -n 'CLOUD_SYNC_REQUIRES_PREMIUM' "$FILE"
          grep -q 'CLOUD_SYNC_REQUIRES_PREMIUM = false' "$FILE"

      - name: Install JS dependencies
        run: |
          set -euo pipefail
          {
            echo "node-linker=hoisted"
            echo "shamefully-hoist=true"
            echo "public-hoist-pattern[]=*"
          } >> .npmrc
          pnpm install

      - name: Vendor wasm / pdfjs assets
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          for leaf in \
            prepare-public-vendor \
            copy-pdfjs-js copy-pdfjs-wasm copy-pdfjs-fonts \
            copy-flatten-pdfjs-annotation-layer-css copy-flatten-pdfjs-text-layer-css \
            copy-simplecc copy-jieba
          do
            pnpm run "$leaf" || echo "::warning::vendor optional fail: $leaf"
          done

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          # 绕过 dotenv-cli（Windows 上会缺 which / path-key 等模块）
          if [ -f .env.tauri ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|\#*) continue ;;
                *=*) export "$line" 2>/dev/null || true ;;
              esac
            done < .env.tauri
          fi
          pnpm exec next build

      - name: Build Windows (Tauri)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          printf '%s\n' '{"build":{"beforeBuildCommand":""}}' > .ci-tauri-override.json

          if [ "${{ inputs.release }}" = "true" ]; then
            FLAG=""
            PROFILE="release"
          else
            FLAG="--debug"
            PROFILE="debug"
          fi

          # 同样避免 dotenv-cli
          if [ -f .env.tauri ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|\#*) continue ;;
                *=*) export "$line" 2>/dev/null || true ;;
              esac
            done < .env.tauri
          fi
          pnpm exec tauri build $FLAG --no-bundle --config .ci-tauri-override.json

          ROOT="${GITHUB_WORKSPACE}"
          EXE=$(find "$ROOT" -name 'readest.exe' -type f 2>/dev/null | head -1)
          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            echo "::error::readest.exe not found"
            find "$ROOT/target" -name '*.exe' 2>/dev/null | head -50 || true
            exit 1
          fi
          mkdir -p "$ROOT/dist"
          cp "$EXE" "$ROOT/dist/readest.exe"
          ls -la "$ROOT/dist/"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-free-cloud-sync-windows
          path: dist/readest.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Android
  # - gen/android 上游为空，必须 tauri android init
  # - 不用 --debug，减小体积
  # - 补 MANAGE_EXTERNAL_STORAGE，否则无法「管理所有文件」
  # - release 用 debug 密钥签名，便于侧载
  # ---------------------------------------------------------------------------
  build-android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & platforms
        run: |
          set -euo pipefail
          sdkmanager --install \
            "ndk;27.0.12077973" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"
          yes | sdkmanager --licenses || true

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          NDK_DIR="${ANDROID_HOME}/ndk/27.0.12077973"
          echo "NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          test -d "$NDK_DIR"
          ls -la "${ANDROID_HOME}/ndk"

      - name: Cache cargo & pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            node_modules
            apps/readest-app/node_modules
          key: free-cloud-and-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/readest-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            free-cloud-and-v4-${{ runner.os }}-

      - name: Disable cloud-sync premium gate
        run: |
          set -euo pipefail
          FILE="apps/readest-app/src/utils/access.ts"
          sed -i 's/export const CLOUD_SYNC_REQUIRES_PREMIUM = true;/export const CLOUD_SYNC_REQUIRES_PREMIUM = false;/' "$FILE"
          grep -n 'CLOUD_SYNC_REQUIRES_PREMIUM' "$FILE"
          grep -q 'CLOUD_SYNC_REQUIRES_PREMIUM = false' "$FILE"

      - name: Install JS dependencies
        run: |
          set -euo pipefail
          {
            echo "node-linker=hoisted"
            echo "shamefully-hoist=true"
            echo "public-hoist-pattern[]=*"
          } >> .npmrc
          pnpm install

      - name: Vendor wasm / pdfjs assets
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          for leaf in \
            prepare-public-vendor \
            copy-pdfjs-js copy-pdfjs-wasm copy-pdfjs-fonts \
            copy-flatten-pdfjs-annotation-layer-css copy-flatten-pdfjs-text-layer-css \
            copy-simplecc copy-jieba
          do
            pnpm run "$leaf" || echo "::warning::vendor optional fail: $leaf"
          done

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          if [ -f .env.tauri ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|\#*) continue ;;
                *=*) export "$line" 2>/dev/null || true ;;
              esac
            done < .env.tauri
          fi
          pnpm exec next build

      - name: Init Android project (gen/android)
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          rm -rf src-tauri/gen/android
          pnpm exec tauri android init

          test -f src-tauri/gen/android/settings.gradle \
            || test -f src-tauri/gen/android/settings.gradle.kts
          ls -la src-tauri/gen/android/

          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'xmlns:tools=' "$MANIFEST"; then
              sed -i 's|xmlns:android="http://schemas.android.com/apk/res/android"|xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"
            fi
            if ! grep -q 'MANAGE_EXTERNAL_STORAGE' "$MANIFEST"; then
              sed -i 's|<manifest\([^>]*\)>|<manifest\1>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />|' "$MANIFEST"
            fi
            if ! grep -q 'requestLegacyExternalStorage' "$MANIFEST"; then
              sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|' "$MANIFEST" || true
            fi
            echo "===== Manifest (permissions) ====="
            grep -E 'uses-permission|requestLegacy|package=' "$MANIFEST" || true
          else
            echo "::warning::AndroidManifest.xml not found"
          fi

          GRADLE_KTS="src-tauri/gen/android/app/build.gradle.kts"
          if [ -f "$GRADLE_KTS" ] && ! grep -q 'missingDimensionStrategy' "$GRADLE_KTS"; then
            if grep -q 'defaultConfig' "$GRADLE_KTS"; then
              sed -i 's/defaultConfig {/defaultConfig {\n        missingDimensionStrategy("store", "foss")/' "$GRADLE_KTS" || true
            fi
          fi

          if [ -f "$GRADLE_KTS" ]; then
            if ! grep -q 'signingConfig = signingConfigs.getByName("debug")' "$GRADLE_KTS"; then
              sed -i '/release {/,/}/ s|isMinifyEnabled = false|isMinifyEnabled = false\n            signingConfig = signingConfigs.getByName("debug")|' "$GRADLE_KTS" || true
            fi
          fi

      - name: Build Android APK (release, debug-signed)
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          if [ -f .env.tauri ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|\#*) continue ;;
                *=*) export "$line" 2>/dev/null || true ;;
              esac
            done < .env.tauri
          fi
          pnpm exec tauri android build --apk -t aarch64

          ROOT="${GITHUB_WORKSPACE}"
          mkdir -p "$ROOT/dist"
          APK=$(find "$ROOT" -path '*release*' -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find "$ROOT" -name '*.apk' -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK not found"
            find "$ROOT" -name '*.apk' 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "Using APK: $APK ($(du -h "$APK" | cut -f1))"
          cp "$APK" "$ROOT/dist/Readest-free-cloud-sync.apk"
          ls -la "$ROOT/dist/"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-free-cloud-sync-android
          path: dist/Readest-free-cloud-sync.apk
          if-no-files-found: error
          retention-days: 14
