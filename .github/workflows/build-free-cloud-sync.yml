# .github/workflows/build-free-cloud-sync.yml
#
# 解锁 CLOUD_SYNC_REQUIRES_PREMIUM（支持 WebDAV 等同步方式），
# 编译 Windows exe + Android APK，并自动发布到 Release & Artifacts。
#
# 用法：Actions → Build free cloud-sync → Run workflow

name: Build free cloud-sync

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Windows: Release 优化构建（无控制台黑框）"
        type: boolean
        default: true
      build_windows:
        description: "编译 Windows exe"
        type: boolean
        default: true
      build_android:
        description: "同时编译 Android APK"
        type: boolean
        default: false
      publish_release:
        description: "同时创建/更新 GitHub Release（便于手机与电脑直接下载）"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  APP_DIR: apps/readest-app

jobs:
  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------
  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/readest-app/src-tauri/target
          key: free-cloud-win-cargo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/readest-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            free-cloud-win-cargo-${{ runner.os }}-

      - name: Disable cloud-sync premium gate
        run: |
          set -euo pipefail
          FILE="apps/readest-app/src/utils/access.ts"
          sed -i 's/export const CLOUD_SYNC_REQUIRES_PREMIUM = true;/export const CLOUD_SYNC_REQUIRES_PREMIUM = false;/' "$FILE"
          sed -i 's/export const TTS_CACHE_REQUIRES_PREMIUM = true;/export const TTS_CACHE_REQUIRES_PREMIUM = false;/' "$FILE" || true
          grep -n 'CLOUD_SYNC_REQUIRES_PREMIUM' "$FILE"
          grep -q 'CLOUD_SYNC_REQUIRES_PREMIUM = false' "$FILE"

      - name: Install JS dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline

      - name: Setup vendors (pdfjs, simplecc, jieba)
        run: |
          set -euo pipefail
          pnpm --filter @readest/readest-app setup-vendors

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        env:
          NEXT_PUBLIC_APP_PLATFORM: tauri
          DBUS_ID: com.bilingify.readest
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -euo pipefail
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > .env.local
          pnpm exec next build

      - name: Build Windows (Tauri)
        working-directory: ${{ env.APP_DIR }}
        env:
          NEXT_PUBLIC_APP_PLATFORM: tauri
          DBUS_ID: com.bilingify.readest
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          printf '%s\n' '{"build":{"beforeBuildCommand":""}}' > .ci-tauri-override.json

          if [ "${{ inputs.release }}" = "true" ]; then
            FLAG=""
          else
            FLAG="--debug"
          fi

          pnpm exec tauri build $FLAG --no-bundle --config .ci-tauri-override.json

          ROOT="${GITHUB_WORKSPACE}"
          EXE=""
          for candidate in \
            "$ROOT/target/release/readest.exe" \
            "$ROOT/target/x86_64-pc-windows-msvc/release/readest.exe" \
            "$ROOT/apps/readest-app/src-tauri/target/release/readest.exe"
          do
            if [ -f "$candidate" ]; then
              EXE="$candidate"
              break
            fi
          done

          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            EXE=$(find "$ROOT" -name 'readest.exe' -type f 2>/dev/null | head -1 || true)
          fi

          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            echo "::error::readest.exe not found"
            find "$ROOT" -name '*.exe' 2>/dev/null | head -50 || true
            exit 1
          fi

          echo "Found readest.exe at: $EXE ($(du -h "$EXE" | cut -f1))"
          mkdir -p "$ROOT/dist"
          cp "$EXE" "$ROOT/dist/readest.exe"
          ls -la "$ROOT/dist/"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-free-cloud-sync-windows
          path: dist/readest.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Android
  # ---------------------------------------------------------------------------
  build-android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK & platforms
        run: |
          set -euo pipefail
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"
          yes | sdkmanager --licenses || true

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          NDK_DIR="${ANDROID_HOME}/ndk/28.2.13676358"
          echo "NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          test -d "$NDK_DIR"
          ls -la "${ANDROID_HOME}/ndk"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/readest-app/src-tauri/target
          key: free-cloud-and-cargo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/readest-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            free-cloud-and-cargo-${{ runner.os }}-

      - name: Disable cloud-sync premium gate
        run: |
          set -euo pipefail
          FILE="apps/readest-app/src/utils/access.ts"
          sed -i 's/export const CLOUD_SYNC_REQUIRES_PREMIUM = true;/export const CLOUD_SYNC_REQUIRES_PREMIUM = false;/' "$FILE"
          sed -i 's/export const TTS_CACHE_REQUIRES_PREMIUM = true;/export const TTS_CACHE_REQUIRES_PREMIUM = false;/' "$FILE" || true
          grep -n 'CLOUD_SYNC_REQUIRES_PREMIUM' "$FILE"
          grep -q 'CLOUD_SYNC_REQUIRES_PREMIUM = false' "$FILE"

      - name: Install JS dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline

      - name: Setup vendors (pdfjs, simplecc, jieba)
        run: |
          set -euo pipefail
          pnpm --filter @readest/readest-app setup-vendors

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        env:
          NEXT_PUBLIC_APP_PLATFORM: tauri
          DBUS_ID: com.bilingify.readest
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -euo pipefail
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > .env.local
          pnpm exec next build

      - name: Init Android project (gen/android)
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          rm -rf src-tauri/gen/android
          pnpm exec tauri android init

          test -f src-tauri/gen/android/settings.gradle \
            || test -f src-tauri/gen/android/settings.gradle.kts
          ls -la src-tauri/gen/android/

          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'xmlns:tools=' "$MANIFEST"; then
              sed -i 's|xmlns:android="http://schemas.android.com/apk/res/android"|xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"
            fi
            if ! grep -q 'MANAGE_EXTERNAL_STORAGE' "$MANIFEST"; then
              sed -i 's|<manifest\([^>]*\)>|<manifest\1>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />|' "$MANIFEST"
            fi
            if ! grep -q 'requestLegacyExternalStorage' "$MANIFEST"; then
              sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|' "$MANIFEST" || true
            fi
            echo "===== Manifest (permissions) ====="
            grep -E 'uses-permission|requestLegacy|package=' "$MANIFEST" || true
          else
            echo "::warning::AndroidManifest.xml not found"
          fi

          GRADLE_KTS="src-tauri/gen/android/app/build.gradle.kts"
          if [ -f "$GRADLE_KTS" ] && ! grep -q 'missingDimensionStrategy' "$GRADLE_KTS"; then
            if grep -q 'defaultConfig' "$GRADLE_KTS"; then
              sed -i 's/defaultConfig {/defaultConfig {\n        missingDimensionStrategy("store", "foss")/' "$GRADLE_KTS" || true
            fi
          fi

          if [ -f "$GRADLE_KTS" ]; then
            if ! grep -q 'signingConfig = signingConfigs.getByName("debug")' "$GRADLE_KTS"; then
              sed -i '/release {/,/}/ s|isMinifyEnabled = false|isMinifyEnabled = false\n            signingConfig = signingConfigs.getByName("debug")|' "$GRADLE_KTS" || true
            fi
          fi

      - name: Build Android APK (release, debug-signed)
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > .env.local
          pnpm exec tauri android build --apk -t aarch64

          ROOT="${GITHUB_WORKSPACE}"
          mkdir -p "$ROOT/dist"
          APK=$(find "$ROOT" -path '*release*' -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find "$ROOT" -name '*.apk' -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK not found"
            find "$ROOT" -name '*.apk' 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "Using APK: $APK ($(du -h "$APK" | cut -f1))"
          cp "$APK" "$ROOT/dist/Readest-free-cloud-sync.apk"
          ls -la "$ROOT/dist/"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-free-cloud-sync-android
          path: dist/Readest-free-cloud-sync.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Release to GitHub (Optional)
  # ---------------------------------------------------------------------------
  publish-release:
    needs: [build-windows, build-android]
    if: ${{ always() && inputs.publish_release && (needs.build-windows.result == 'success' || needs.build-android.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: readest-free-cloud-sync-windows
          path: release-assets

      - name: Download Android artifact
        if: ${{ needs.build-android.result == 'success' && inputs.build_android }}
        uses: actions/download-artifact@v4
        with:
          name: readest-free-cloud-sync-android
          path: release-assets

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/readest-app/package.json').version")
          TAG="v${VERSION}-free"
          TITLE="Readest v${VERSION} (Free Cloud Sync / WebDAV)"
          BODY="### Readest v${VERSION} 解锁版
          - 解锁了 WebDAV 等第三方云同步付费门限制（第三者云同步不受会员计划限制）
          - 基于官方上游最新代码编译
          
          #### 文件下载：
          - Windows 绿色便携版：\`readest.exe\`
          - Android 安装包：\`Readest-free-cloud-sync.apk\` (针对 aarch64 优化，支持全部文件访问权限)"

          echo "Publishing release with tag: $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes "$BODY" --prerelease=false

          for f in release-assets/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f..."
              gh release upload "$TAG" "$f" --clobber
            fi
          done
